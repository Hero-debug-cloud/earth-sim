[project]
name = "earth-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinay", email = "vinay.chandola@zethic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "numpy>=2.5.4",
